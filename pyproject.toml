[project]
name = "regulation-chatbot"
version = "0.1.0"
description = "사내 규정 RAG 챗봇 (임베딩: 로컬 bge-m3 / LLM: OpenAI, Claude API)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LangChain 1.x
    "langchain-core (>=1.7.1)",
    "langchain-community (>=0.4.2)",
    "langchain-text-splitters (>=1.1.3)",
    "langchain-openai (>=1.7.3)",
    "langchain-anthropic (>=1.7.7)",
    "langchain-huggingface (>=1.2.3)",
    "langchain-chroma (>=1.1.0)",
    # 로컬 임베딩 (bge-m3, CPU)
    "sentence-transformers (>=6.2.0)",
    # PDF 로더
    "pymupdf (>=2.0)",
    # 키워드 검색 (BM25 + 한국어 형태소 분석)
    "rank-bm25 (>=0.2.2)",
    "kiwipiepy (>=0.24.1)",
    # UI, 설정
    "gradio (>=6.31.0)",
    "python-dotenv (>=1.2.4)",
    "python-docx (>=1.2.0)",
]

[tool.poetry]
packages = [{ include = "regbot", from = "src" }]

[tool.poetry.group.dev.dependencies]
ipykernel = ">=7.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
